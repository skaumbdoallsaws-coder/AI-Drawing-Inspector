schema_version: 1
skill_id: trace-assembly-impact
version: 1.0.1
intents:
  - explain_assembly_impact
  - trace_affected_interface
required_evidence:
  - failed_characteristic
  - inspected_part
  - assembly_component_identity
forbidden_context:
  - revision.diff
  - disassembly.plan
side_effect_policy:
  default: prohibited
  require_explicit_user_request: []
output_contract:
  format: concise_evidence_chain
  maximum_sentences: 4
failure_behavior:
  missing_required_context: explain_local_effect_only
  contradictory_context: abstain_and_report_conflict
compatible_models:
  - claude-sonnet
evaluation_suite: assembly-impact-v1
context_budget:
  maximum_tokens: 6000
  priorities:
    - fai.characteristics
    - assembly.parts
    - part.feature_map
    - assembly.mates
    - motion.groups
    - viewport.state
