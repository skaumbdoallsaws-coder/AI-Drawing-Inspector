      <stop offset="0" stop-color="#8DE9F8"/><stop offset="0.5" stop-color="#27B2D5"/><stop offset="1" stop-color="#0A6F95"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="0.7" stdDeviation="0.55" flood-color="#071A26" flood-opacity="0.30"/>
    </filter>
    <style>
      .ink { stroke:#193847; }
      .soft { stroke:#426273; }
      .detail { stroke:#193847; stroke-width:1.15; stroke-linecap:round; stroke-linejoin:round; fill:none; }
      .fine { stroke:#426273; stroke-width:0.85; stroke-linecap:round; stroke-linejoin:round; fill:none; }
      .edge { stroke:#193847; stroke-width:1.2; stroke-linecap:round; stroke-linejoin:round; }
      .edge2 { stroke:#193847; stroke-width:1.45; stroke-linecap:round; stroke-linejoin:round; }
      .hi { stroke:#FFFFFF; stroke-opacity:.72; stroke-width:.75; stroke-linecap:round; fill:none; }
