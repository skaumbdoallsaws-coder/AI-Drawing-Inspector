schema_version: 1
skill_id: generate-process-map
version: 1.2.0
intents:
  - generate_process_map
required_evidence:
  - process_map_graph
  - process_map_state
  - process_map_evidence
forbidden_context:
  - browser.process_map_digest
  - browser.process_map_state
side_effect_policy:
  default: prohibited
  require_explicit_user_request:
    - build_process_map_preview
output_contract:
