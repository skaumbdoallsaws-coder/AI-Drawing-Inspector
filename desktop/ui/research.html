<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none';">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>InspectorPro Browser</title><link rel="stylesheet" href="research.css"></head>
<body><header>
<div class="top"><div id="tabs" role="tablist" aria-label="Browser tabs"></div>
<button id="new" title="New tab" aria-label="New tab">+</button>
<button id="detach" title="Open in separate window" aria-label="Open in separate window"><span class="icon detach" aria-hidden="true"></span></button>
<button id="expand" title="Expand browser" aria-label="Expand browser">&#8596;</button>
<button id="hide" title="Hide browser" aria-label="Hide browser">&#215;</button></div>
<form id="address-form"><button type="button" id="back" title="Back" aria-label="Back">&#8592;</button>
<button type="button" id="forward" title="Forward" aria-label="Forward">&#8594;</button>
<button type="button" id="reload" title="Reload" aria-label="Reload">&#8635;</button>
<input id="address" aria-label="Website address or search" placeholder="Search or enter an HTTPS address" autocomplete="off" spellcheck="false">
<button type="submit" title="Go" aria-label="Go">&#8629;</button>
<button type="button" id="downloads" title="Downloads" aria-label="Downloads"><span class="icon download" aria-hidden="true"></span></button>
<select id="more" title="Browser menu" aria-label="Browser menu"><option value="">&#8942;</option><option value="download">Save current page or document</option><option value="external">Open in default browser</option><option value="zoom-in">Zoom in</option><option value="zoom-out">Zoom out</option><option value="zoom-reset">Reset zoom</option></select></form>
<div class="status"><span id="status" role="status"></span><button id="cancel-downloads" hidden>Cancel download</button></div>
</header><script src="research.js"></script></body></html>
