schema_version: 1
skill_id: generate-facility-layout
version: 1.10.0
intents:
  - generate_facility_layout
  - propose_actor_navigation
  - present_actor_navigation
required_evidence:
  - facility_layout_digest
forbidden_context:
  - browser.facility_layout_digest
  - browser.facility_layout_state
  - browser.facility_layout_evidence
side_effect_policy:
  default: prohibited
  require_explicit_user_request:
    - preview_facility_move
    - build_facility_layout_preview
    - generate_full_factory_draft
    - generate_facility_planning_prototype_draft
    - amend_facility_program_resource_batch_draft
    - propose_navigation_intent
    - build_activity_scenario
output_contract:
  format: concise_facility_layout_proposal
  maximum_sentences: 6
failure_behavior:
  missing_required_context: report_missing_evidence
  contradictory_context: abstain_and_report_conflict
compatible_models:
  - claude-sonnet
  - gateway-facility-planner
evaluation_suite: facility-layout-generation-v1
context_budget:
  maximum_tokens: 12000
  priorities:
    - facility_layout.digest
    - facility_layout.evidence
    - facility_layout.state
